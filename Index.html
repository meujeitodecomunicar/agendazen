<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Automático para Terapeutas Holísticos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>Simplifique sua Agenda, Transforme Vidas.</h1>
            <p class="subtitle">Agendamento automático e intuitivo para terapeutas holísticos focados em bem-estar e cura.</p>
            <button class="cta-button">Comece a Agendar Agora!</button>
        </div>
    </header>

    <section class="contact-form">
        <h2>Entre em Contato</h2>
        <p>Descubra como otimizar seu tempo e atrair mais clientes.</p>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-button">Enviar Mensagem</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Agendamento Holístico. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
